<!DOCTYPE html>
<html lang="fr" class="wa-theme-default wa-palette-default wa-brand-red wa-light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hub de navigation</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <!-- Web Awesome : thème, couleurs et utilitaires (sans les « styles natifs », qui restylent tous les <button>). -->
    <link rel="stylesheet" href="vendor/webawesome/styles/themes/default.css">
    <link rel="stylesheet" href="vendor/webawesome/styles/color/variants.css">
    <link rel="stylesheet" href="vendor/webawesome/styles/utilities.css">
    <link rel="stylesheet" href="hub.css">
    <!-- Chargeur Web Awesome : charge chaque composant à la demande (librairies dans vendor/, voir tools/vendor.sh). -->
    <script type="module" src="vendor/webawesome/webawesome.loader.js" data-webawesome="vendor/webawesome"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="hub-root"></div>


    <!-- ============================================================ -->
    <!-- Application                                                  -->
    <!-- ============================================================ -->
    <template id="tpl-app">
      <div v-if="!store.loaded" class="loading"><wa-spinner></wa-spinner></div>

      <template-gallery v-else-if="showGallery" cancellable
        @choose="chooseTemplate" @blank="startBlank" @cancel="store.gallery = false"></template-gallery>

      <div v-else class="stage" :class="{ 'stage--panel': store.editing && store.panel }">
        <div v-if="store.editing" class="edit-bar" role="toolbar" aria-label="Édition du hub">
          <div class="edit-bar__info">
            <strong>Modification du hub</strong>
            <span class="edit-bar__hint">Cliquez sur un bouton pour le modifier, glissez-le pour le déplacer.</span>
          </div>
          <div class="wa-cluster wa-gap-xs">
            <wa-button size="s" :appearance="store.panel ? 'filled' : 'outlined'" @click="store.panel = !store.panel">
              <wa-icon slot="start" name="palette"></wa-icon>Affichage
            </wa-button>
            <wa-button size="s" appearance="plain" @click="cancel">Annuler</wa-button>
            <wa-button size="s" variant="brand" @click="finish"><wa-icon slot="start" name="check"></wa-icon>Terminé</wa-button>
          </div>
        </div>

        <div v-if="emptyView" class="empty wa-stack wa-gap-m wa-align-items-center wa-text-center">
          <wa-icon class="empty__icon" name="layout-grid"></wa-icon>
          <template v-if="canEdit()">
            <h2 class="wa-heading-l">Votre hub est vide</h2>
            <p class="wa-color-text-quiet">Ajoutez, un par un, des boutons vers les pages du document ou vers des sites web.</p>
            <wa-button variant="brand" @click="startEditing()"><wa-icon slot="start" name="plus"></wa-icon>Ajouter le premier bouton</wa-button>
            <wa-button appearance="plain" size="s" @click="store.gallery = true">ou partir d'un modèle</wa-button>
          </template>
          <template v-else>
            <h2 class="wa-heading-l">Page d'accueil en préparation</h2>
            <p class="wa-color-text-quiet">Ce hub n'a pas encore été configuré par un éditeur du document.</p>
          </template>
        </div>
        <hub-view v-else :config="config" :mode="store.editing ? 'edit' : 'view'"></hub-view>

        <settings-panel v-if="store.editing && store.panel"></settings-panel>
      </div>

      <wa-button v-if="showFab" class="floating floating--top" size="s" appearance="outlined" pill @click="startEditing()">
        <wa-icon slot="start" name="pencil" label="Modifier le hub"></wa-icon><span class="floating__text">Modifier</span>
      </wa-button>

      <button-card v-if="store.editing"></button-card>

      <wa-dialog :open.prop="!!store.confirm" :label="store.confirm ? store.confirm.label : ''"
        @wa-hide="e => e.target === e.currentTarget && answer(false)">
        {{ store.confirm && store.confirm.text }}
        <wa-button slot="footer" appearance="plain" @click="answer(false)">Annuler</wa-button>
        <wa-button slot="footer" variant="danger" @click="answer(true)">{{ store.confirm && store.confirm.ok }}</wa-button>
      </wa-dialog>

      <wa-toast placement="bottom-start"></wa-toast>
    </template>

    <!-- ============================================================ -->
    <!-- Le hub (lecture, édition sur place, miniatures)              -->
    <!-- ============================================================ -->
    <template id="tpl-hub">
      <div class="hub" :style="rootStyle" :class="[
          'hub--' + m.c.charte, 'hub--' + m.c.look.shape, 'hub--size-' + m.c.look.size, 'hub--align-' + m.c.look.align,
          { 'hub--on-dark': m.onDark, 'hub--image': m.image, 'hub--columns': m.c.look.columns, 'hub--edit': mode === 'edit' }]">
        <div v-if="m.hasHeader" class="hub__band" :class="'hub__band--' + m.headerStyle">
          <header class="hub__head" :class="'hub__head--' + m.c.header.align">
            <img v-if="m.c.header.logo" class="hub__logo" :src="m.c.header.logo" alt="">
            <div v-if="mode === 'edit'" class="hub__head-edit">
              <input class="hub__title hub__title-input" type="text" :value="m.c.header.title" placeholder="Titre de la page d'accueil"
                aria-label="Titre de la page d'accueil" @input="setHeader('title', $event.target.value)">
              <span class="hub__bar" aria-hidden="true"></span>
              <input class="hub__subtitle hub__subtitle-input" type="text" :value="m.c.header.subtitle" placeholder="Sous-titre (facultatif)"
                aria-label="Sous-titre" @input="setHeader('subtitle', $event.target.value)">
            </div>
            <div v-else class="wa-stack wa-gap-2xs">
              <h1 v-if="m.c.header.title" class="hub__title">{{ m.c.header.title }}</h1>
              <p v-if="m.c.header.subtitle" class="hub__subtitle">{{ m.c.header.subtitle }}</p>
            </div>
          </header>
        </div>

        <main class="hub__body">
          <section v-for="s in m.sections" :key="s.id" class="hub__section">
            <div v-if="mode === 'edit'" class="hub__section-edit">
              <input class="hub__section-input" type="text" :value="s.title" placeholder="Titre de rubrique (facultatif)"
                aria-label="Titre de la rubrique" @input="setTitle(s.id, $event.target.value)">
              <button v-if="m.sections.length > 1" type="button" class="hub__section-remove" title="Supprimer la rubrique"
                aria-label="Supprimer la rubrique" @click="removeSection(s.id)"><wa-icon name="trash-2"></wa-icon></button>
            </div>
            <h2 v-else-if="s.title" class="hub__section-title">{{ s.title }}</h2>
            <div class="hub__grid" v-sortable="sortable" :data-key="s.id">
              <component :is="tagOf(item)" v-for="item in s.items" :key="item.b.id" class="hub-btn"
                :id="mode === 'edit' ? 'hb-' + item.b.id : null"
                :class="{ 'hub-btn--problem': item.link.problem, 'hub-btn--no-icon': !item.b.icon, 'hub-btn--selected': mode === 'edit' && store.editId === item.b.id }"
                :style="{ '--c': item.color.bg, '--c-on': item.color.fg }"
                :href="mode === 'view' ? item.link.href : null" :target="mode === 'view' ? item.link.target : null"
                :rel="item.link.external ? 'noopener noreferrer' : null"
                :title="item.link.problem ? item.label + ' — ' + item.link.problem : (item.b.description || item.label)"
                :type="tagOf(item) === 'button' ? 'button' : null"
                :data-id="item.b.id" @click="click($event, item)">
                <span v-if="item.b.icon" class="hub-btn__icon">
                  <wa-icon v-if="isIconName(item.b.icon)" :name="item.b.icon"></wa-icon>
                  <template v-else>{{ item.b.icon }}</template>
                </span>
                <span class="hub-btn__text">
                  <span class="hub-btn__label">{{ item.label }}</span>
                  <span v-if="item.b.description" class="hub-btn__desc">{{ item.b.description }}</span>
                </span>
                <wa-icon class="hub-btn__go" :name="item.link.external ? 'external-link' : 'arrow-right'"></wa-icon>
              </component>
              <ghost-tile v-if="mode === 'edit'" :section-id="s.id"></ghost-tile>
            </div>
          </section>
          <div v-if="mode === 'edit'">
            <button type="button" class="hub__add-section" @click="addSection"><wa-icon name="list-plus"></wa-icon>Ajouter une rubrique</button>
          </div>
          <footer v-if="m.c.footer" class="hub__footer">{{ m.c.footer }}</footer>
        </main>
      </div>
    </template>

    <!-- ============================================================ -->
    <!-- Galerie de modèles                                           -->
    <!-- ============================================================ -->
    <template id="tpl-gallery">
      <div class="gallery wa-stack wa-gap-xl">
        <div class="wa-split wa-align-items-start">
          <div class="wa-stack wa-gap-2xs">
            <h1 class="wa-heading-xl">Que doit faire cette page d'accueil&nbsp;?</h1>
            <p class="wa-color-text-quiet">Choisissez un point de départ, avec les pages de votre document. Tout reste modifiable ensuite.</p>
          </div>
          <wa-button v-if="cancellable" appearance="plain" @click="$emit('cancel')">Annuler</wa-button>
        </div>
        <div class="gallery__grid">
          <button v-for="t in templates" :key="t.id" type="button" class="choice choice--large" @click="$emit('choose', t.id)">
            <span class="choice__preview"><hub-view :config="t.preview" mode="static"></hub-view></span>
            <span class="choice__text">
              <span class="choice__label">{{ t.label }}</span>
              <span class="wa-caption-s wa-color-text-quiet">{{ t.description }}</span>
            </span>
          </button>
        </div>
        <div class="wa-cluster wa-justify-content-center">
          <wa-button appearance="plain" @click="$emit('blank')">
            <wa-icon slot="start" name="file-plus"></wa-icon>Partir d'une page vierge
          </wa-button>
        </div>
      </div>
    </template>

    <!-- ============================================================ -->
    <!-- Choix visuel (miniatures)                                    -->
    <!-- ============================================================ -->
    <template id="tpl-choices">
      <div class="wa-stack wa-gap-xs">
        <span class="field-label">{{ label }}</span>
        <div class="choices" :class="{ 'choices--small': small }" role="radiogroup" :aria-label="label">
          <button v-for="o in options" :key="o.value" type="button" class="choice" role="radio"
            :aria-checked="String(o.value === value)" :title="o.hint || o.label" @click="$emit('change', o.value)">
            <span v-if="o.swatches" class="choice__swatches"><span v-for="c in o.swatches" :style="{ background: c }"></span></span>
            <span v-else class="choice__preview"><hub-view :config="o.preview" mode="static"></hub-view></span>
            <span class="choice__label">{{ o.label }}</span>
          </button>
        </div>
      </div>
    </template>

    <!-- ============================================================ -->
    <!-- Case « Ajouter un bouton »                                   -->
    <!-- ============================================================ -->
    <template id="tpl-ghost">
      <div class="hub-adder" :class="{ 'hub-adder--open': active }">
        <dest-picker v-if="active" autofocus label="Vers où mène ce bouton ?" @pick="create" @cancel="close" @leave="close"></dest-picker>
        <button v-else type="button" class="hub-adder__button" @click="open"><wa-icon name="plus"></wa-icon>Ajouter un bouton</button>
      </div>
    </template>

    <!-- ============================================================ -->
    <!-- Champ de destination : une page du document ou un site web    -->
    <!-- ============================================================ -->
    <template id="tpl-dest">
      <div class="dest" @focusout="onFocusOut">
        <span class="dest__label" :id="uid + '-label'">{{ label }}</span>
        <div class="dest__kinds" role="group" :aria-labelledby="uid + '-label'">
          <button type="button" class="dest__kind" :aria-pressed="String(kind === 'page')" @mousedown.prevent @click="setKind('page')">
            <wa-icon name="file-text"></wa-icon>Une page
          </button>
          <button type="button" class="dest__kind" :aria-pressed="String(kind === 'url')" @mousedown.prevent @click="setKind('url')">
            <wa-icon name="globe"></wa-icon>Un site web
          </button>
        </div>
        <div class="dest__field">
          <wa-icon :name="kind === 'url' ? 'link' : 'search'"></wa-icon>
          <input :id="uid" ref="input" class="dest__input" type="text" role="combobox" autocomplete="off" spellcheck="false"
            aria-autocomplete="list" :aria-labelledby="uid + '-label'" :aria-expanded="String(options.length > 0)" :aria-controls="uid + '-list'"
            :aria-activedescendant="options.length ? uid + '-o' + active : null"
            :placeholder="kind === 'url' ? 'www.exemple.fr' : 'Nom de la page'" :value="query" @input="query = $event.target.value" @keydown="onKey">
        </div>
        <ul :id="uid + '-list'" class="dest__list" role="listbox" :aria-labelledby="uid + '-label'">
          <li v-for="(o, i) in options" :key="o.key" :id="uid + '-o' + i" role="option" :aria-selected="String(i === active)"
            class="dest__option" :class="{ 'dest__option--active': i === active }" @mousedown.prevent="pick(o)" @mousemove="active = i">
            <wa-icon :name="o.icon"></wa-icon>
            <span class="dest__name">{{ o.label }}</span>
            <span v-if="o.hint" class="dest__hint">{{ o.hint }}</span>
          </li>
          <li v-if="!options.length" class="dest__empty">{{ emptyText }}</li>
        </ul>
        <p class="dest__keys">Entrée pour valider · Échap pour fermer</p>
      </div>
    </template>

    <!-- ============================================================ -->
    <!-- Fiche d'un bouton (à côté du bouton)                         -->
    <!-- ============================================================ -->
    <template id="tpl-card">
      <wa-popover v-if="b" :key="b.id" :for="'hb-' + b.id" :open.prop="true" placement="right-start" class="card"
        @wa-after-hide="onHide($event, b.id)">
        <div class="card__body">
          <div class="card__head">
            <h3 class="card__title">Modifier le bouton</h3>
            <wa-button size="s" appearance="plain" data-popover="close"><wa-icon name="x" label="Fermer la fiche"></wa-icon></wa-button>
          </div>

          <div class="card__section">
            <wa-input class="f-label" label="Texte du bouton" maxlength="80" :placeholder="placeholder" :value.prop="b.label"
              @input="b.label = $event.target.value"></wa-input>
            <wa-textarea label="Description" rows="2" resize="none" placeholder="Une phrase pour préciser la destination (facultatif)"
              :value.prop="b.description" @input="b.description = $event.target.value"></wa-textarea>
          </div>

          <div class="card__section">
            <span class="field-label">Destination</span>
            <dest-picker v-if="changing" autofocus label="Nouvelle destination" :initial-kind="b.kind"
              @pick="setDest" @cancel="changing = false"></dest-picker>
            <template v-else>
              <div class="card__dest">
                <span class="card__dest-icon"><wa-icon :name="b.kind === 'url' ? 'globe' : 'file-text'"></wa-icon></span>
                <span class="card__dest-text">
                  <span class="card__dest-kind">{{ b.kind === 'url' ? 'Site web' : 'Page du document' }}</span>
                  <span class="card__dest-name">{{ describe }}</span>
                </span>
                <wa-button size="s" appearance="outlined" @click="changing = true">Changer</wa-button>
              </div>
              <wa-switch v-if="b.kind === 'url'" :checked.prop="b.newTab" @change="b.newTab = $event.target.checked">Ouvrir dans un nouvel onglet</wa-switch>
            </template>
          </div>

          <div class="card__section">
            <span class="field-label">Icône</span>
            <div class="card__icons" role="radiogroup" aria-label="Icône">
              <button v-for="i in iconChoices" :key="i.name" type="button" class="icon-choice" role="radio" :title="i.label" :aria-label="i.label"
                :aria-checked="String(b.icon === i.name)" @click="b.icon = i.name"><wa-icon :name="i.name"></wa-icon></button>
              <button type="button" class="icon-choice icon-choice--more" :aria-expanded="String(moreIcons)" @click="moreIcons = !moreIcons">
                {{ moreIcons ? 'Moins' : 'Plus d\'icônes' }}
              </button>
            </div>
            <template v-if="moreIcons">
              <wa-input size="s" placeholder="Rechercher : budget, carte, équipe…" with-clear :value.prop="iconQuery" @input="iconQuery = $event.target.value">
                <wa-icon slot="start" name="search"></wa-icon>
              </wa-input>
              <div class="icon-grid" role="radiogroup" aria-label="Toutes les icônes">
                <button v-for="i in icons" :key="i.name" type="button" class="icon-choice" role="radio" :title="i.label" :aria-label="i.label"
                  :aria-checked="String(b.icon === i.name)" @click="b.icon = i.name"><wa-icon :name="i.name"></wa-icon></button>
                <button type="button" class="icon-choice icon-choice--none" role="radio" :aria-checked="String(!b.icon)" @click="b.icon = ''">Aucune</button>
              </div>
            </template>
          </div>

          <div class="card__section">
            <span class="field-label">Couleur</span>
            <div class="card__swatches" role="radiogroup" aria-label="Couleur">
              <button v-for="[id, label] in colors" :key="id" type="button" class="swatch" role="radio" :title="label" :aria-label="label"
                :aria-checked="String(b.color === id)" :style="{ background: id === 'auto' ? autoGradient : chartColors[id].bg }" @click="b.color = id"></button>
            </div>
          </div>

          <div class="card__foot">
            <wa-button size="s" variant="danger" appearance="plain" @click="remove"><wa-icon slot="start" name="trash-2"></wa-icon>Supprimer</wa-button>
            <wa-button size="s" variant="brand" data-popover="close">Fermer</wa-button>
          </div>
        </div>
      </wa-popover>
    </template>

    <!-- ============================================================ -->
    <!-- Panneau Affichage                                            -->
    <!-- ============================================================ -->
    <template id="tpl-settings">
      <aside class="panel" aria-label="Affichage du hub">
        <div class="panel__head wa-split">
          <h2 class="wa-heading-m">Affichage</h2>
          <wa-button size="s" appearance="plain" @click="store.panel = false"><wa-icon name="x" label="Fermer le panneau"></wa-icon></wa-button>
        </div>
        <div class="panel__body wa-stack wa-gap-2xl">
          <choice-grid label="Style des tuiles" :value="d.look.shape" :options="choices.shape" @change="v => d.look.shape = v"></choice-grid>
          <choice-grid label="Couleurs" :value="d.look.palette" :options="choices.palette" small @change="v => d.look.palette = v"></choice-grid>

          <div class="wa-stack wa-gap-m">
            <span class="field-label">Image de fond</span>
            <wa-switch :checked.prop="hasImage" @change="setImage($event.target.checked)">Afficher une image en fond de page</wa-switch>
            <template v-if="hasImage">
              <div class="wa-stack wa-gap-2xs">
                <wa-input label="Adresse de l'image" type="url" placeholder="https://… (laisser vide pour l'image par défaut)"
                  :value.prop="d.background.image.startsWith('data:') ? '' : d.background.image" @input="d.background.image = $event.target.value.trim()"></wa-input>
                <div class="wa-cluster wa-gap-xs">
                  <wa-button size="s" appearance="outlined" @click="$refs.bgFile.click()"><wa-icon slot="start" name="image-up"></wa-icon>Importer une photo</wa-button>
                  <wa-button v-if="d.background.image" size="s" appearance="plain" @click="d.background.image = ''">Image par défaut</wa-button>
                  <input ref="bgFile" type="file" accept="image/*" hidden @change="importImage($event, v => d.background.image = v, false)">
                </div>
              </div>
              <wa-radio-group label="Voile" hint="Assombrit ou éclaircit l'image pour garder le texte lisible." orientation="horizontal"
                :value.prop="d.background.tone" @change="d.background.tone = $event.target.value">
                <wa-radio appearance="button" value="dark">Sombre</wa-radio>
                <wa-radio appearance="button" value="light">Clair</wa-radio>
              </wa-radio-group>
              <wa-slider label="Intensité du voile" min="0" max="0.9" step="0.05" with-tooltip
                :value-formatter.prop="v => Math.round(v * 100) + ' %'" :value.prop="d.background.veil" @input="d.background.veil = Number($event.target.value)"></wa-slider>
            </template>
          </div>

          <div class="wa-stack wa-gap-m">
            <span class="field-label">Disposition</span>
            <wa-radio-group label="Taille des tuiles" orientation="horizontal" :value.prop="d.look.size" @change="d.look.size = $event.target.value">
              <wa-radio appearance="button" value="s">Petite</wa-radio>
              <wa-radio appearance="button" value="m">Moyenne</wa-radio>
              <wa-radio appearance="button" value="l">Grande</wa-radio>
            </wa-radio-group>
            <wa-radio-group label="Alignement" orientation="horizontal" :value.prop="d.look.align" @change="d.look.align = $event.target.value">
              <wa-radio appearance="button" value="left">À gauche</wa-radio>
              <wa-radio appearance="button" value="center">Centré</wa-radio>
            </wa-radio-group>
            <wa-select label="Colonnes" :value.prop="String(d.look.columns)" @change="d.look.columns = Number($event.target.value)">
              <wa-option value="0">Automatique (selon la largeur)</wa-option>
              <wa-option v-for="n in 6" :key="n" :value="String(n)">{{ n }}</wa-option>
            </wa-select>
          </div>

          <p class="wa-caption-xs wa-color-text-quiet">Hub de navigation — version {{ version }}</p>
        </div>
      </aside>
    </template>
  </body>
</html>
